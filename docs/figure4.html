<script>
// ═══════════════════════════════════════════════════════════════
//  Statistical helpers
// ═══════════════════════════════════════════════════════════════

function lgamma(x) {
  if (x < 0.5) return Math.log(Math.PI / Math.sin(Math.PI * x)) - lgamma(1 - x);
  x -= 1;
  const c = [
    0.99999999999980993, 676.5203681218851, -1259.1392167224028,
    771.32342877765313, -176.61502916214059, 12.507343278686905,
    -0.13857109526572012, 9.9843695780195716e-6, 1.5056327351493116e-7
  ];
  let a = c[0];
  const t = x + 7.5;
  for (let i = 1; i < 9; i++) a += c[i] / (x + i);
  return 0.5 * Math.log(2 * Math.PI) + (x + 0.5) * Math.log(t) - t + Math.log(a);
}

function betaCF(a, b, x) {
  const MAXIT = 200, EPS = 3e-7;
  const qab = a + b, qap = a + 1, qam = a - 1;
  let c = 1, d = 1 - qab * x / qap;
  if (Math.abs(d) < 1e-30) d = 1e-30;
  d = 1 / d; let h = d;
  for (let m = 1; m <= MAXIT; m++) {
    const m2 = 2 * m;
    let aa = m * (b - m) * x / ((qam + m2) * (a + m2));
    d = 1 + aa * d; if (Math.abs(d) < 1e-30) d = 1e-30;
    c = 1 + aa / c; if (Math.abs(c) < 1e-30) c = 1e-30;
    d = 1 / d; h *= d * c;
    aa = -(a + m) * (qab + m) * x / ((a + m2) * (qap + m2));
    d = 1 + aa * d; if (Math.abs(d) < 1e-30) d = 1e-30;
    c = 1 + aa / c; if (Math.abs(c) < 1e-30) c = 1e-30;
    d = 1 / d; const del = d * c; h *= del;
    if (Math.abs(del - 1) < EPS) break;
  }
  return h;
}

function ibeta(a, b, x) {
  if (x <= 0) return 0; if (x >= 1) return 1;
  const lbeta = lgamma(a) + lgamma(b) - lgamma(a + b);
  const front = Math.exp(Math.log(x) * a + Math.log(1 - x) * b - lbeta) / a;
  return front * betaCF(a, b, x);
}

function pearsonPValue(r, n) {
  if (n < 3 || !isFinite(r)) return NaN;
  const t = Math.abs(r) * Math.sqrt((n - 2) / Math.max(1e-14, 1 - r * r));
  const x = (n - 2) / ((n - 2) + t * t);
  return ibeta(0.5 * (n - 2), 0.5, x);   // two-tailed p
}

function pearsonR(x, y) {
  const n = x.length;
  const mx = d3.mean(x), my = d3.mean(y);
  let num = 0, dx2 = 0, dy2 = 0;
  for (let i = 0; i < n; i++) {
    const xi = x[i] - mx, yi = y[i] - my;
    num += xi * yi; dx2 += xi * xi; dy2 += yi * yi;
  }
  return dx2 * dy2 === 0 ? 0 : num / Math.sqrt(dx2 * dy2);
}

function linReg(x, y) {
  const mx = d3.mean(x), my = d3.mean(y);
  let num = 0, denom = 0;
  for (let i = 0; i < x.length; i++) { num += (x[i]-mx)*(y[i]-my); denom += (x[i]-mx)**2; }
  const slope = denom === 0 ? 0 : num / denom;
  return { slope, intercept: my - slope * mx };
}

// Metrics are pre-computed in R (per-iteration average) — just look up by name.

function fmtStat(r, p) {
  const rs = (r >= 0 ? "" : "−") + Math.abs(r).toFixed(2);
  const ps = p < 0.001 ? p.toExponential(2) : p.toFixed(3);
  return `r = ${rs}, p = ${ps}`;
}

// ═══════════════════════════════════════════════════════════════
//  Config
// ═══════════════════════════════════════════════════════════════

const THRESHOLDS = [
  0.5, 0.525, 0.55, 0.575, 0.6, 0.625, 0.65, 0.675,
  0.7, 0.725, 0.75, 0.775, 0.8, 0.825, 0.85, 0.875, 0.9
];

const ISLAND_ORDER = [
  "El Hierro", "Fuerteventura", "Gran Canaria", "La Gomera",
  "Tenerife South", "Tenerife Teno", "Western Sahara"
];

const METRIC_LABELS = { f05: "F0.5 score", f1: "F1 score", pr_auc: "PR-AUC" };

// Colors matched to original figures
const C = {
  jaqDot:   "#6BAED6",   // steelblue dots (Jaccard panels)
  jaqLine:  "#C49AB0",   // mauve/rose regression line
  distDot:  "#E07060",   // salmon dots (distance panel)
  distLine: "#5B95C5",   // steelblue regression line
  hmLow:    "#B2C5E2",   // lightsteelblue2
  hmHigh:   "#EEA2A2",   // rosybrown2
};

// Panel definitions
const PANELS = [
  { id: "pa", xField: "jaccard_pollinators", title: "Pollinator overlap", xLabel: "Jaccard similarity",           letter: "(a)", dotC: C.jaqDot, lineC: C.jaqLine, showYLabel: true  },
  { id: "pb", xField: "jaccard_plants",      title: "Plant overlap",      xLabel: "Jaccard similarity",           letter: "(b)", dotC: C.jaqDot, lineC: C.jaqLine, showYLabel: false },
  { id: "pc", xField: "jaccard_edges",       title: "Interaction overlap",xLabel: "Jaccard similarity",           letter: "(c)", dotC: C.jaqDot, lineC: C.jaqLine, showYLabel: true  },
  { id: "pd", xField: "distance_km",         title: "Geographic distance",xLabel: "Geographic distance (km)",     letter: "(d)", dotC: C.distDot, lineC: C.distLine, showYLabel: false },
];

// ═══════════════════════════════════════════════════════════════
//  State
// ═══════════════════════════════════════════════════════════════

let appData = null;
let state = { threshIdx: 8, metric: "f05", selectedPair: null };

// ── pair key helper ──
function pairKey(train, test) { return `${train}||${test}`; }

// ── cross-panel selection ──
function highlightPair(key) {
  state.selectedPair = key;

  // Scatter dots
  d3.selectAll("circle.dot")
    .classed("faded",    d => pairKey(d.train_name, d.test_name) !== key)
    .classed("selected", d => pairKey(d.train_name, d.test_name) === key);

  // Heatmap tile
  d3.selectAll("rect.tile")
    .classed("sel-highlight", d => pairKey(d.train, d.test) === key);
}

function clearSelection() {
  state.selectedPair = null;
  d3.selectAll("circle.dot").classed("faded", false).classed("selected", false);
  d3.selectAll("rect.tile").classed("sel-highlight", false);
}

// Click on empty background clears selection
["scatter-grid", "heatmap-wrap"].forEach(id => {
  document.getElementById(id).addEventListener("click", e => {
    if (e.target.tagName !== "circle" && e.target.tagName !== "rect") clearSelection();
  });
});

// ═══════════════════════════════════════════════════════════════
//  Controls
// ═══════════════════════════════════════════════════════════════

document.getElementById("thresh-slider").addEventListener("input", function () {
  state.threshIdx = +this.value;
  document.getElementById("thresh-display").textContent =
    THRESHOLDS[state.threshIdx].toFixed(3);
  if (appData) render();
});

document.querySelectorAll(".metric-btn").forEach(btn => {
  btn.addEventListener("click", function () {
    document.querySelectorAll(".metric-btn").forEach(b => b.classList.remove("active"));
    this.classList.add("active");
    state.metric = this.dataset.metric;
    if (appData) render();
  });
});

// ═══════════════════════════════════════════════════════════════
//  Data loading
// ═══════════════════════════════════════════════════════════════

d3.json("figure4_data.json").then(raw => {
  appData = raw;
  render();
});

// ═══════════════════════════════════════════════════════════════
//  Render orchestrator
// ═══════════════════════════════════════════════════════════════

function render() {
  // JSON keys are like "0.6", not "0.600" — strip trailing zeros
  const threshKey = parseFloat(THRESHOLDS[state.threshIdx].toFixed(3)).toString();
  const metric    = state.metric;

  // Score all pairs — metrics pre-computed in R
  // PR-AUC is threshold-independent and stored at the pair level (p.pr_auc).
  // F0.5 and F1 are stored per threshold under p.metrics[threshKey].
  const isPrAuc = metric === "pr_auc";
  const slider  = document.getElementById("thresh-slider");
  slider.disabled = isPrAuc;
  slider.style.opacity = isPrAuc ? "0.35" : "1";

  // Score scatter data: per (emln_id, train, test) — matches paper's N_lambdas × N_pairs points
  // Fall back to pairs if scatter not present (e.g. old JSON)
  const scatterSource = appData.scatter || appData.pairs;
  const scoredScatter = scatterSource.map(p => {
    let score;
    if (isPrAuc) {
      score = p.pr_auc;
    } else {
      const m = p.metrics[threshKey];
      if (!m) return null;
      score = m[metric];
    }
    return { ...p, score: isFinite(score) ? score : NaN };
  }).filter(p => p !== null && isFinite(p.score));

  // Score heatmap data: per (train, test), averaged across emln_id
  const scoredHeatmap = appData.pairs.map(p => {
    let score;
    if (isPrAuc) {
      score = p.pr_auc;
    } else {
      const m = p.metrics[threshKey];
      if (!m) return null;
      score = m[metric];
    }
    return { ...p, score: isFinite(score) ? score : NaN };
  }).filter(p => p !== null && isFinite(p.score));

  const offDiag = scoredScatter.filter(p => p.layer_comparison === "Added location");

  // Shared y-domain across all 4 scatter panels
  const yVals   = offDiag.map(d => d.score).filter(isFinite);
  const yDomain = d3.scaleLinear().domain(d3.extent(yVals)).nice().domain();

  PANELS.forEach(cfg => drawScatter(cfg, offDiag, yDomain, metric));
  drawHeatmap(scoredHeatmap, metric);

  // Restore any active selection after redraw
  if (state.selectedPair) highlightPair(state.selectedPair);
}

// ═══════════════════════════════════════════════════════════════
//  Scatter panel
// ═══════════════════════════════════════════════════════════════

function drawScatter(cfg, data, yDomain, metric) {
  const container = document.getElementById(cfg.id);
  container.innerHTML = "";

  const W_total = container.clientWidth  || 320;
  const H_total = container.clientHeight || 260;
  const ml = cfg.showYLabel ? 52 : 38, mr = 16, mt = 34, mb = 50;
  const W = W_total - ml - mr;
  const H = H_total - mt - mb;

  const pts = data.filter(d =>
    d[cfg.xField] != null && isFinite(d[cfg.xField]) && isFinite(d.score));
  const xVals = pts.map(d => d[cfg.xField]);
  const yVals = pts.map(d => d.score);

  const xDomain = d3.scaleLinear().domain(d3.extent(xVals)).nice().domain();
  const xScale  = d3.scaleLinear().domain(xDomain).range([0, W]);
  const yScale  = d3.scaleLinear().domain(yDomain).range([H, 0]);

  const svg = d3.select(container).append("svg")
    .attr("width", W_total).attr("height", H_total);
  const g   = svg.append("g").attr("transform", `translate(${ml},${mt})`);

  // Axes
  g.append("g").attr("class", "axis x-axis")
    .attr("transform", `translate(0,${H})`)
    .call(d3.axisBottom(xScale).ticks(4).tickFormat(d => {
      return cfg.xField === "distance_km"
        ? d3.format("d")(d)
        : d3.format(".2g")(d);
    }));

  g.append("g").attr("class", "axis y-axis")
    .call(d3.axisLeft(yScale).ticks(5).tickFormat(d3.format(".2f")));

  // Axis labels
  g.append("text").attr("class", "axis-label")
    .attr("x", W / 2).attr("y", H + 38)
    .attr("text-anchor", "middle").text(cfg.xLabel);

  if (cfg.showYLabel) {
    g.append("text").attr("class", "axis-label")
      .attr("transform", "rotate(-90)")
      .attr("x", -H / 2).attr("y", -40)
      .attr("text-anchor", "middle")
      .text(METRIC_LABELS[metric]);
  }

  // Regression line
  const { slope, intercept } = linReg(xVals, yVals);
  const [x0, x1] = xDomain;
  g.append("line")
    .attr("x1", xScale(x0)).attr("y1", yScale(slope * x0 + intercept))
    .attr("x2", xScale(x1)).attr("y2", yScale(slope * x1 + intercept))
    .attr("stroke", cfg.lineC).attr("stroke-width", 1.6)
    .attr("opacity", 0.88);

  // Points
  const tt = d3.select("#tooltip");
  g.selectAll("circle.dot").data(pts).join("circle")
    .attr("class", "dot")
    .attr("cx", d => xScale(d[cfg.xField]))
    .attr("cy", d => yScale(d.score))
    .attr("r", 4.5).attr("fill", cfg.dotC).attr("opacity", 0.68)
    .attr("stroke", "white").attr("stroke-width", 0.5)
    .on("mouseover", (event, d) => {
      const xStr = cfg.xField === "distance_km"
        ? `${d[cfg.xField].toFixed(0)} km`
        : d[cfg.xField].toFixed(3);
      tt.style("display", "block")
        .html(`<strong>${d.train_name} → ${d.test_name}</strong>`
            + `${METRIC_LABELS[metric]}: ${d.score.toFixed(4)}<br>`
            + `${cfg.title}: ${xStr}<br>`);
    })
    .on("mousemove", event => {
      const ex = event.clientX, ey = event.clientY;
      tt.style("left", (ex + 14) + "px").style("top", (ey - 32) + "px");
    })
    .on("mouseout", () => tt.style("display", "none"))
    .on("click", (event, d) => {
      event.stopPropagation();
      const key = pairKey(d.train_name, d.test_name);
      if (state.selectedPair === key) clearSelection();
      else highlightPair(key);
    });

  // Correlation stats + panel title
  const r = pearsonR(xVals, yVals);
  const p = pearsonPValue(r, xVals.length);
  const titleText = `${cfg.title}: ${fmtStat(r, p)}`;

  // Panel letter (top-left)
  g.append("text").attr("class", "panel-letter")
    .attr("x", -ml + 6).attr("y", -14).text(cfg.letter);

  // Title centered
  g.append("text").attr("class", "panel-title")
    .attr("x", W / 2).attr("y", -16)
    .attr("text-anchor", "middle").text(titleText);
}

// ═══════════════════════════════════════════════════════════════
//  Heatmap
// ═══════════════════════════════════════════════════════════════

function drawHeatmap(allPairs, metric) {
  const wrap = document.getElementById("heatmap-wrap");
  wrap.innerHTML = "";

  const availW = wrap.clientWidth  || 480;
  const availH = wrap.clientHeight || 700;

  // Margins (leave room for rotated x-labels, y-labels, legend)
  const ml = 102, mr = 90, mt = 18, mb = 96;
  const cellSize = Math.min(
    Math.floor((availW - ml - mr) / 7),
    Math.floor((availH - mt - mb) / 7)
  );
  const gridW = cellSize * 7;
  const gridH = cellSize * 7;

  // Score lookup
  const scoreMap = {};
  allPairs.forEach(p => { scoreMap[`${p.train_name}|${p.test_name}`] = p.score; });

  // Color scale: diverging, midpoint = mean(range)
  const scores = allPairs.map(p => p.score).filter(isFinite);
  const [sMin, sMax] = d3.extent(scores);
  const sMid = (sMin + sMax) / 2;
  const colorScale = t => {
    // manual interpolation: hmLow → white → hmHigh
    if (t <= 0.5) return d3.interpolateRgb(C.hmLow, "white")(t * 2);
    return d3.interpolateRgb("white", C.hmHigh)((t - 0.5) * 2);
  };
  const hmColor = val => {
    if (!isFinite(val)) return "#ccc";
    const t = (val - sMin) / (sMax - sMin);
    return colorScale(Math.max(0, Math.min(1, t)));
  };

  const xScale = d3.scaleBand().domain(ISLAND_ORDER).range([0, gridW]).padding(0.03);
  // y: El Hierro at bottom → reverse domain
  const yScale = d3.scaleBand().domain([...ISLAND_ORDER].reverse()).range([0, gridH]).padding(0.03);

  const svgW = gridW + ml + mr;
  const svgH = gridH + mt + mb;
  const svg = d3.select(wrap).append("svg")
    .attr("width",  svgW)
    .attr("height", svgH)
    .style("max-width", "100%")
    .style("max-height", "100%");

  const g = svg.append("g").attr("transform", `translate(${ml},${mt})`);
  const tt = d3.select("#tooltip");

  // Build cell data
  const cells = [];
  ISLAND_ORDER.forEach(train => {
    ISLAND_ORDER.forEach(test => {
      cells.push({
        train, test,
        score: scoreMap[`${train}|${test}`],
        isDiag: train === test
      });
    });
  });

  // Filled tiles
  g.selectAll("rect.tile").data(cells).join("rect")
    .attr("class", "tile")
    .attr("x",      d => xScale(d.train))
    .attr("y",      d => yScale(d.test))
    .attr("width",  xScale.bandwidth())
    .attr("height", yScale.bandwidth())
    .attr("fill",   d => hmColor(d.score))
    .attr("stroke", "#bbb").attr("stroke-width", 0.25)
    .on("mouseover", (event, d) => {
      const label = isFinite(d.score) ? d.score.toFixed(4) : "N/A";
      const type  = d.isDiag ? "Within location" : "Auxiliary location";
      tt.style("display", "block")
        .html(`<strong>${d.train} → ${d.test}</strong>`
            + `${METRIC_LABELS[metric]}: ${label}<br>${type}`);
    })
    .on("mousemove", event => {
      tt.style("left", (event.clientX + 14) + "px")
        .style("top",  (event.clientY - 32) + "px");
    })
    .on("mouseout", () => tt.style("display", "none"))
    .on("click", (event, d) => {
      event.stopPropagation();
      const key = pairKey(d.train, d.test);
      if (state.selectedPair === key) clearSelection();
      else highlightPair(key);
    });

  // Diagonal outlines (thick border)
  g.selectAll("rect.diag").data(cells.filter(d => d.isDiag)).join("rect")
    .attr("class", "diag")
    .attr("x",      d => xScale(d.train))
    .attr("y",      d => yScale(d.test))
    .attr("width",  xScale.bandwidth())
    .attr("height", yScale.bandwidth())
    .attr("fill", "none").attr("stroke", "#000").attr("stroke-width", 2.2)
    .attr("pointer-events", "none");

  // X axis — Added location (bottom, rotated)
  g.append("g").attr("class", "hm-axis")
    .attr("transform", `translate(0,${gridH})`)
    .call(d3.axisBottom(xScale).tickSize(0))
    .call(ax => ax.select(".domain").remove())
    .call(ax => ax.selectAll("text")
      .attr("transform", "rotate(-40)")
      .attr("text-anchor", "end")
      .attr("dx", "-0.4em").attr("dy", "0.4em")
      .style("font-size", "10px"));

  // Y axis — Predicted location (left)
  g.append("g").attr("class", "hm-axis")
    .call(d3.axisLeft(yScale).tickSize(0))
    .call(ax => ax.select(".domain").remove())
    .call(ax => ax.selectAll("text")
      .attr("text-anchor", "end").attr("x", -6)
      .style("font-size", "10px"));

  // Axis title: Added location (x)
  g.append("text").attr("class", "axis-label")
    .attr("x", gridW / 2).attr("y", gridH + mb - 8)
    .attr("text-anchor", "middle").attr("font-size", "12px")
    .text("Auxiliary location");

  // Axis title: Predicted location (y, rotated)
  g.append("text").attr("class", "axis-label")
    .attr("transform", "rotate(-90)")
    .attr("x", -gridH / 2).attr("y", -ml + 10)
    .attr("text-anchor", "middle").attr("font-size", "12px")
    .text("Target location");

  // ── Color legend ──
  const legH  = Math.min(gridH * 0.72, 180);
  const legW  = 14;
  const legX  = gridW + 22;
  const legY  = (gridH - legH) / 2;

  const lgG = g.append("g").attr("transform", `translate(${legX},${legY})`);

  // gradient definition
  const defs   = svg.append("defs");
  const gradId = "hmgrad";
  const grad   = defs.append("linearGradient").attr("id", gradId)
    .attr("x1", 0).attr("y1", 1).attr("x2", 0).attr("y2", 0);
  const nStops = 30;
  for (let i = 0; i <= nStops; i++) {
    grad.append("stop")
      .attr("offset", `${(i / nStops * 100).toFixed(1)}%`)
      .attr("stop-color", hmColor(sMin + (i / nStops) * (sMax - sMin)));
  }

  lgG.append("rect")
    .attr("width", legW).attr("height", legH)
    .attr("fill", `url(#${gradId})`)
    .attr("stroke", "#aaa").attr("stroke-width", 0.5);

  // Tick values: min, mid, max
  const legScale = d3.scaleLinear().domain([sMin, sMax]).range([legH, 0]);
  const nTicks   = 5;
  const tickVals = d3.range(nTicks).map(i => sMin + i * (sMax - sMin) / (nTicks - 1));

  lgG.append("g").attr("transform", `translate(${legW},0)`)
    .call(d3.axisRight(legScale).tickValues(tickVals).tickFormat(d3.format(".2f")))
    .call(ax => ax.select(".domain").remove())
    .call(ax => ax.selectAll("line").attr("stroke", "#999").attr("x2", 4))
    .call(ax => ax.selectAll("text").style("font-size", "9.5px").attr("x", 6));

  // Legend title
  lgG.append("text").attr("class", "legend-title")
    .attr("x", legW / 2).attr("y", -7)
    .attr("text-anchor", "middle").attr("font-size", "10.5px")
    .text(METRIC_LABELS[metric]);
}
</script>
</body>
</html>
